          <p class="slogan" data-i18n="hero2_slogan"></p>
          <div class="slide-btns">

          <span class="stat-number count-up" data-target="500" data-suffix="+" data-i18n="stat2_num"></span>
          <span class="stat-label" data-i18n="stat2_lbl"></span>
