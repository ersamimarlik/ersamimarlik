<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hakkımızda — Ersa Mimarlık | Başakşehir İstanbul</title>
  <meta name="description" content="Ersa Mimarlık, 1990'lı yıllardan bu yana Adem Demir ve mimar İmren Demir'in öncülüğünde cam, alüminyum ve mimari proje hizmetleri sunmaktadır.">
  <meta name="keywords" content="ersa mimarlık hakkında, adem demir, imren demir mimar, başakşehir mimarlık">
  <link rel="canonical" href="https://www.ersamimarlik.com/hakkimizda.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-inner">
      <img src="images/logo-nav.png" alt="Ersa Mimarlık">
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>
  </div>

  <div id="wa-placeholder"></div>
  <a class="back-to-top" id="backToTop" aria-label="Yukarı Dön"><i class="fas fa-chevron-up"></i></a>
  <div id="header-placeholder"></div>

  <!-- ================================================
       SAYFA BAŞLIĞI
       ================================================ -->
  <div class="page-header">
    <div class="container">
      <h1 data-i18n="nav_about"></h1>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html" data-i18n="nav_home"></a>
        <span><i class="fas fa-chevron-right" style="font-size:.65rem"></i></span>
        <span data-i18n="nav_about"></span>
      </nav>
    </div>
  </div>

  <main>

    <!-- ================================================
         FİRMA HİKAYESİ
         Metinleri lang.js içindeki about_story_* anahtarları ile güncelleyin
         ================================================ -->
    <section class="about-story section-padding">
      <div class="container">
        <div class="about-story-grid">
          <div class="about-text fade-in">
            <h2 data-i18n="about_story_title"></h2>
            <p data-i18n="about_story_p1"></p>
            <p data-i18n="about_story_p2"></p>
            <p class="highlight" data-i18n="about_story_quote"></p>
            <p data-i18n="about_story_p3"></p>
            <p data-i18n="about_story_p4"></p>
            <div style="margin-top:32px">
              <a href="iletisim.html" class="btn btn-primary" data-i18n="btn_contact"></a>
            </div>
          </div>

          <!-- HAKKIMIZDA GÖRSELLERİ: src değerlerini güncelleyebilirsiniz -->
          <div class="about-img-wrap fade-in delay-2">
            <img class="about-img-main" src="images/uygulamalar/dis-cephe1.jpeg" alt="Ersa Mimarlık Uygulama" loading="lazy">
            <img class="about-img-accent" src="images/uygulamalar/f.jpeg" alt="Ersa Mimarlık Proje" loading="lazy">
          </div>
        </div>
      </div>
    </section>

    <!-- ================================================
         EKİBİMİZ
         Kişi bilgilerini ve avatar görsellerini buradan güncelleyin
         Avatar görseli: images/placeholders/ klasörüne yuvarlak bir görsel ekleyip
         src değerini değiştirin.
         ================================================ -->
    <section class="team-section" aria-label="Ekibimiz">
      <div class="container">
        <div class="section-header fade-in">
          <h2 data-i18n="team_title"></h2>
        </div>
        <div class="team-grid">

          <!-- EKİP ÜYESİ 1: İMREN DEMİR -->
          <div class="team-card fade-in delay-1">
            <!-- AVATAR: Gerçek fotoğraf eklemek için src'yi değiştirin (100x100 px, yuvarlak) -->
            <img class="team-avatar" src="images/placeholders/avatar-imren.svg" alt="İmren Demir — Yüksek Mimar">
            <h4>İmren Demir</h4>
            <p class="team-role" data-i18n="team_imren_role"></p>
          </div>

          <!-- EKİP ÜYESİ 2: ADEM DEMİR -->
          <div class="team-card fade-in delay-2">
            <!-- AVATAR: Gerçek fotoğraf eklemek için src'yi değiştirin -->
            <img class="team-avatar" src="images/placeholders/avatar-adem.svg" alt="Adem Demir — Kurucu">
            <h4>Adem Demir</h4>
            <p class="team-role" data-i18n="team_adem_role"></p>
          </div>

        </div>
      </div>
    </section>

    <!-- ================================================
         DEĞERLERİMİZ
         ================================================ -->
    <section class="values-section section-padding" aria-label="Değerlerimiz">
      <div class="container">
        <div class="section-header fade-in">
          <h2 data-i18n="values_title"></h2>
        </div>
        <div class="values-grid">
          <div class="value-card fade-in delay-1">
            <div class="value-icon"><i class="fas fa-handshake"></i></div>
            <h4 data-i18n="val1_title"></h4>
            <p data-i18n="val1_desc"></p>
          </div>
          <div class="value-card fade-in delay-2">
            <div class="value-icon"><i class="fas fa-star"></i></div>
            <h4 data-i18n="val2_title"></h4>
            <p data-i18n="val2_desc"></p>
          </div>
          <div class="value-card fade-in delay-3">
            <div class="value-icon"><i class="fas fa-lightbulb"></i></div>
            <h4 data-i18n="val3_title"></h4>
            <p data-i18n="val3_desc"></p>
          </div>
          <div class="value-card fade-in delay-4">
            <div class="value-icon"><i class="fas fa-layer-group"></i></div>
            <h4 data-i18n="val4_title"></h4>
            <p data-i18n="val4_desc"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section class="cta-section" aria-label="İletişim">
      <div class="container">
        <div class="cta-content fade-in">
          <h2 data-i18n="cta_title"></h2>
          <p data-i18n="cta_desc"></p>
          <div class="cta-btns">
            <a href="tel:+905323517791" class="btn btn-primary"><i class="fas fa-phone"></i> 0532 351 77 91</a>
            <a href="iletisim.html" class="btn btn-outline-white" data-i18n="btn_contact"></a>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>

  <script src="js/components.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { initComponents('about'); initLang(); });
  </script>
</body>
</html>
