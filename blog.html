<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Ersa Mimarlık | Cam Sistemleri ve Mimarlık Makaleleri</title>

  <link rel="canonical" href="https://www.ersamimarlik.com/blog.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page-loader" id="pageLoader">
    <div class="loader-inner">
      <img src="images/logo-nav.png" alt="Ersa Mimarlık">
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>
  </div>

  <div id="wa-placeholder"></div>
  <a class="back-to-top" id="backToTop" aria-label="Yukarı Dön"><i class="fas fa-chevron-up"></i></a>
  <div id="header-placeholder"></div>

  <div class="page-header">
    <div class="container">
      <h1 data-i18n="blog_page_title"></h1>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html" data-i18n="nav_home"></a>
        <span><i class="fas fa-chevron-right" style="font-size:.65rem"></i></span>
        <span data-i18n="nav_blog"></span>
      </nav>
    </div>
  </div>

  <main>
    <!-- ================================================
         BLOG MAKALE LİSTESİ
         Makaleler data/blog/articles.js dosyasından gelir.
         Yeni makale eklemek için o dosyayı düzenleyin.
         ================================================ -->
    <section class="blog-list section-padding">
      <div class="container">
        <div class="section-header fade-in">
          <p data-i18n="blog_page_desc"></p>
        </div>
        <div class="blog-list-grid" id="blogListContainer">
          <!-- blog.js tarafından doldurulur -->
          <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--gray-400)">
            <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--gold)"></i>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="data/blog/articles.js"></script>
  <script src="js/components.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/main.js"></script>
  <script src="js/blog.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initComponents('blog');
      initLang();
      renderBlogList('blogListContainer');
      initBlogLangListeners();
    });
  </script>

</html>
