<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B1C2E"/>
      <stop offset="100%" style="stop-color:#152D45"/>
    </linearGradient>
    <pattern id="bp" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C9A020" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#g3)"/>
  <rect width="800" height="450" fill="url(#bp)"/>
  <!-- Bina şeması -->
  <rect x="180" y="60" width="200" height="320" fill="none" stroke="#C9A020" stroke-width="2" opacity="0.8"/>
  <rect x="200" y="80" width="60" height="80" fill="none" stroke="#C9A020" stroke-width="1.5" opacity="0.7"/>
  <rect x="280" y="80" width="60" height="80" fill="none" stroke="#C9A020" stroke-width="1.5" opacity="0.7"/>
  <rect x="200" y="180" width="60" height="80" fill="none" stroke="#C9A020" stroke-width="1.5" opacity="0.7"/>
  <rect x="280" y="180" width="60" height="80" fill="none" stroke="#C9A020" stroke-width="1.5" opacity="0.7"/>
  <rect x="220" y="280" width="80" height="80" fill="none" stroke="#C9A020" stroke-width="1.5" opacity="0.7"/>
  <!-- Ölçü çizgileri -->
  <line x1="165" y1="60" x2="165" y2="380" stroke="#C9A020" stroke-width="1" opacity="0.6"/>
  <line x1="160" y1="60" x2="170" y2="60" stroke="#C9A020" stroke-width="1" opacity="0.6"/>
  <line x1="160" y1="380" x2="170" y2="380" stroke="#C9A020" stroke-width="1" opacity="0.6"/>
  <!-- Sağ taraf metin -->
  <text x="550" y="180" fill="#C9A020" font-size="20" font-family="Georgia,serif" opacity="0.9">MİMARİ PROJE</text>
  <line x1="490" y1="195" x2="690" y2="195" stroke="#C9A020" stroke-width="1" opacity="0.5"/>
  <text x="490" y="225" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial,sans-serif">Fikir → Tasarım → Ruhsat</text>
  <text x="490" y="245" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial,sans-serif">→ Uygulama</text>
  <text x="540" y="415" text-anchor="middle" fill="#C9A020" font-size="14" font-family="Georgia,serif" opacity="0.9" letter-spacing="4">MİMARİ PROJE SÜRECİ</text>
</svg>
