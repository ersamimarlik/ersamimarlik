<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1C2E"/>
      <stop offset="100%" style="stop-color:#1E3F5A"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#C9A020" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <!-- Mimari çizim - modern bina cephesi -->
  <rect x="100" y="80" width="260" height="440" fill="none" stroke="#C9A020" stroke-width="2" opacity="0.7"/>
  <!-- Kat bölmeleri -->
  <line x1="100" y1="180" x2="360" y2="180" stroke="#C9A020" stroke-width="0.8" opacity="0.4"/>
  <line x1="100" y1="280" x2="360" y2="280" stroke="#C9A020" stroke-width="0.8" opacity="0.4"/>
  <line x1="100" y1="380" x2="360" y2="380" stroke="#C9A020" stroke-width="0.8" opacity="0.4"/>
  <!-- Pencereler - zemin kat -->
  <rect x="120" y="420" width="80" height="80" fill="rgba(201,160,32,0.15)" stroke="#C9A020" stroke-width="1.5" opacity="0.8"/>
  <rect x="240" y="420" width="80" height="80" fill="rgba(201,160,32,0.15)" stroke="#C9A020" stroke-width="1.5" opacity="0.8"/>
  <!-- Pencereler - 1.kat -->
  <rect x="120" y="300" width="60" height="60" fill="rgba(201,160,32,0.1)" stroke="#C9A020" stroke-width="1.2" opacity="0.7"/>
  <rect x="200" y="300" width="60" height="60" fill="rgba(201,160,32,0.1)" stroke="#C9A020" stroke-width="1.2" opacity="0.7"/>
  <rect x="280" y="300" width="60" height="60" fill="rgba(201,160,32,0.1)" stroke="#C9A020" stroke-width="1.2" opacity="0.7"/>
  <!-- Pencereler - 2.kat -->
  <rect x="120" y="200" width="60" height="60" fill="rgba(201,160,32,0.1)" stroke="#C9A020" stroke-width="1.2" opacity="0.7"/>
  <rect x="200" y="200" width="60" height="60" fill="rgba(201,160,32,0.1)" stroke="#C9A020" stroke-width="1.2" opacity="0.7"/>
  <rect x="280" y="200" width="60" height="60" fill="rgba(201,160,32,0.1)" stroke="#C9A020" stroke-width="1.2" opacity="0.7"/>
  <!-- Pencereler - 3.kat -->
  <rect x="140" y="100" width="60" height="60" fill="rgba(201,160,32,0.1)" stroke="#C9A020" stroke-width="1.2" opacity="0.7"/>
  <rect x="240" y="100" width="60" height="60" fill="rgba(201,160,32,0.1)" stroke="#C9A020" stroke-width="1.2" opacity="0.7"/>
  <!-- Sağ taraf - 3D etki -->
  <polygon points="360,80 440,40 440,480 360,520" fill="rgba(201,160,32,0.05)" stroke="#C9A020" stroke-width="1.5" opacity="0.5"/>
  <!-- Üst kenar - 3D -->
  <polygon points="100,80 360,80 440,40 180,40" fill="rgba(201,160,32,0.08)" stroke="#C9A020" stroke-width="1.5" opacity="0.5"/>
  <!-- Logo alanı -->
  <text x="560" y="280" text-anchor="middle" fill="#C9A020" font-size="28" font-family="Georgia,serif" opacity="0.9">ERSA</text>
  <text x="560" y="320" text-anchor="middle" fill="#C9A020" font-size="14" font-family="Georgia,serif" opacity="0.7" letter-spacing="8">MİMARLIK</text>
  <line x1="490" y1="335" x2="630" y2="335" stroke="#C9A020" stroke-width="1" opacity="0.5"/>
  <text x="560" y="360" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11" font-family="Arial,sans-serif" letter-spacing="3">EST. 1990</text>
  <!-- Dekoratif köşeler -->
  <line x1="460" y1="100" x2="500" y2="100" stroke="#C9A020" stroke-width="1.5" opacity="0.6"/>
  <line x1="460" y1="100" x2="460" y2="140" stroke="#C9A020" stroke-width="1.5" opacity="0.6"/>
  <line x1="640" y1="100" x2="680" y2="100" stroke="#C9A020" stroke-width="1.5" opacity="0.6"/>
  <line x1="680" y1="100" x2="680" y2="140" stroke="#C9A020" stroke-width="1.5" opacity="0.6"/>
  <line x1="460" y1="460" x2="500" y2="460" stroke="#C9A020" stroke-width="1.5" opacity="0.6"/>
  <line x1="460" y1="420" x2="460" y2="460" stroke="#C9A020" stroke-width="1.5" opacity="0.6"/>
  <line x1="640" y1="460" x2="680" y2="460" stroke="#C9A020" stroke-width="1.5" opacity="0.6"/>
  <line x1="680" y1="420" x2="680" y2="460" stroke="#C9A020" stroke-width="1.5" opacity="0.6"/>
</svg>
